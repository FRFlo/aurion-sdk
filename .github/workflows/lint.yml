name: Lint

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/format.yml"
      - ".github/workflows/lint.yml"
      - ".github/workflows/publish-npm.yml"
      - "package.json"
      - "bun.lock"
      - "build.ts"
      - "tsconfig.json"
      - ".oxfmtrc.json"
      - ".oxlintrc.json"
      - "src/**"
  pull_request:
    paths:
      - ".github/workflows/format.yml"
      - ".github/workflows/lint.yml"
      - ".github/workflows/publish-npm.yml"
      - "package.json"
      - "bun.lock"
      - "build.ts"
      - "tsconfig.json"
      - ".oxfmtrc.json"
      - ".oxlintrc.json"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run linter
        run: bun run lint

      - name: Build package
        run: bun run build
